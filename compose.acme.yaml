services:
  lego:
    image: goacme/lego:v5.6.0@sha256:6f1583fc026a455ea46a7a5858c576105bb69c2e2de69db391cab7f14750350c
    profiles: [acme]
    command:
      - run
      - --path=/acme
      - --server=letsencrypt
      - --accept-tos
      - --email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --domains=${DERP_HOSTNAME:?Set DERP_HOSTNAME}
      - --dns=cloudflare
      - --dns.resolvers=${ACME_DNS_RESOLVER:-1.1.1.1:53}
      - --dns.propagation.wait=${ACME_DNS_PROPAGATION_WAIT:-0s}
    environment:
      CLOUDFLARE_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_dns_api_token
    volumes:
      - type: bind
        source: ${LEGO_STATE_DIR:?Set LEGO_STATE_DIR}
        target: /acme
        bind:
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${CLOUDFLARE_TOKEN_FILE:?Set CLOUDFLARE_TOKEN_FILE}
        target: /run/secrets/cloudflare_dns_api_token
        read_only: true
        bind:
          create_host_path: true
          selinux: Z
